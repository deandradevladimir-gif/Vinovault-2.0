# Mantiene despierta la demo: Render (plan gratuito) duerme el servicio tras
# 15 minutos sin tráfico y Supabase pausa el proyecto tras 7 días sin uso.
# /api/health responde desde la API y hace una consulta a la base de datos.
name: Keep alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /api/health
        run: |
          curl --fail --silent --show-error \
            --retry 3 --retry-delay 20 --retry-all-errors \
            --max-time 120 \
            https://vinovault-api-f4q9.onrender.com/api/health
